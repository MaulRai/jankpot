name: Deploy to itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  ITCH_USER: maulrai
  ITCH_GAME: jankpot
  EXPORT_NAME: jankpot

jobs:
  export-and-deploy:
    name: Export Windows, Web, Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17 for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          EOF

      - name: Create export output directories
        run: |
          mkdir -p build/web
          mkdir -p build/windows
          mkdir -p build/android

      - name: Export Web
        run: |
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Inject COI Service Worker for Web
        run: |
          wget -q https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -O build/web/coi-serviceworker.min.js
          sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|g' build/web/index.html

      - name: Export Windows
        run: |
          godot --headless --path . --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/android/${{ env.EXPORT_NAME }}.apk

      - name: Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: exported-builds
          path: |
            build/web
            build/windows
            build/android

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v3

      - name: Push Web to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          butler push build/web ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:html5

      - name: Push Windows to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          butler push build/windows ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows

      - name: Push Android to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          butler push build/android ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:android